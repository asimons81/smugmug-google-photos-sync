[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smugmug-google-photos-sync"
version = "1.0.0"
description = "Professional desktop application to sync photos from SmugMug to Google Photos"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SmugMug Google Photos Sync Team"}
]

dependencies = [
    "customtkinter>=5.2.0",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "requests-oauthlib>=1.3.1",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "google-api-python-client>=2.100.0",
    "keyring>=24.2.0",
    "cryptography>=41.0.0",
    "apscheduler>=3.10.0",
    "pystray>=0.19.0",
    "darkdetect>=0.8.0",
    "CTkMessagebox>=2.5",
    "tkcalendar>=1.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
installer = [
    "pyinstaller>=6.0.0",
]

[project.gui-scripts]
smugmug-sync = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
